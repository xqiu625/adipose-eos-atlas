# Conda environment for the Python portions of the pipeline (SCENIC
# visualization/export, CellRank, cross-dataset scoring/metrics scripts).
#
# Hand-maintained from the versions already documented in methods.md/README,
# not generated by `conda env export` on the actual HPCC environment (this
# repo has no access to that environment). Treat this as a best-effort
# starting point, not a byte-exact lock: run
#   conda env create -f environment.yml
#   conda env export --no-builds > environment.lock.yml
# on the HPCC conda env(s) actually used (methods.md/README note that SCENIC,
# CellRank, and scVI/scANVI steps require separate envs -- see
# ab73aeb "Doc: scVI/scANVI need a separate env" in git history) and commit
# the resulting environment.lock.yml as the real lockfile.
name: adipose-eos-atlas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy=1.10.3
  - anndata
  - cellrank=2.0.7
  - scrublet
  - harmonypy
  - scib-metrics
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - networkx
  - h5py
  - pip
  - pip:
      - pyscenic
