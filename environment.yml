# Conda environment matching the actual "cellrank_env" every script's header
# comment declares (e.g. "Conda: /bigdata/godziklab/shared/Xinru/cellrank_env")
# -- scanpy, cellrank, SCENIC (pyscenic/loompy), harmonypy, scanorama, bbknn,
# scib-metrics, scrublet, etc. all live together in that one env on the HPCC.
#
# The one genuine exception is scVI/scANVI: scvi-tools forces anndata>=0.11,
# which breaks this env's anndata pin (see git history commit "Doc:
# scVI/scANVI need a separate env"). Those two methods -- used only in
# scripts/46_integration_benchmark.py -- need environment_scvi.yml instead;
# that script preflight-checks method availability per-environment and skips/
# reports whichever methods aren't importable rather than assuming one env
# has everything.
#
# Hand-maintained from the versions already documented in methods.md/README,
# not generated by `conda env export` on the actual HPCC environment (this
# repo has no access to that environment). Treat this as a best-effort
# starting point, not a byte-exact lock: run
#   conda env create -f environment.yml
#   conda env export --no-builds > environment.lock.yml
# on the HPCC conda env actually used and commit the resulting
# environment.lock.yml (and environment_scvi.lock.yml) as the real lockfiles.
name: adipose-eos-atlas
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy=1.10.3
  - anndata
  - cellrank=2.0.7
  - scrublet
  - harmonypy
  - scanorama
  - bbknn
  - scib-metrics
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - networkx
  - h5py
  - pip
  - pip:
      - pyscenic
      - loompy
