# Separate conda environment for scVI/scANVI, used only by the scvi/scanvi
# methods in scripts/46_integration_benchmark.py
# (`python 46_integration_benchmark.py --methods scvi,scanvi ...`).
#
# scvi-tools forces anndata>=0.11, which breaks environment.yml's core env
# (which cellrank/scanpy/harmonypy/etc. depend on a lower anndata pin for) --
# see git history commit "Doc: scVI/scANVI need a separate env". Do not try
# to merge this into environment.yml.
#
# Hand-maintained, not generated by `conda env export` on the actual HPCC
# environment -- see environment.yml's header for the same caveat and the
# renv/conda-export instructions to produce a real lockfile.
name: adipose-eos-atlas-scvi
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scvi-tools
  - anndata
  - scanpy
  - numpy
  - pandas
  - pip
