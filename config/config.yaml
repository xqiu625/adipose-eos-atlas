# Configuration file for Adipose Eosinophil scRNA-seq Analysis Pipeline
# Ruggiero-Ruff and Qiu et al. 2025

# =============================================================================
# Input Data
# =============================================================================
data:
  raw_data_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "results"

# Sample metadata
samples:
  genotypes: ["WT", "KO"]
  sexes: ["Male", "Female"]
  conditions: ["HFD", "HFD_Infected"]

# =============================================================================
# Analysis Parameters
# =============================================================================

# Preprocessing (Seurat)
preprocessing:
  min_cells: 3
  min_features: 200
  max_features: 5000
  max_mt_percent: 10
  normalization: "LogNormalize"
  scale_factor: 10000
  n_variable_features: 2000

# Dimensionality reduction
dimred:
  n_pcs: 50
  umap_dims: 30
  clustering_resolution: [0.5, 0.8]

# Cell annotation (UCE)
annotation:
  reference: "mouse_kidney_norm"
  confidence_threshold: 0.8

# Eosinophil subclustering
eosinophil:
  resolution: 0.8
  n_clusters: 7  # C0-C6

# Macrophage analysis
macrophage:
  m1_markers: ["Cd80", "Il6", "Ccl2", "Nos2", "Tnf"]
  m2_surface_markers: ["Mrc1", "Lyve1", "Cd301b"]
  m2_functional_markers: ["Arg1", "Il10", "Chil3", "Retnla"]

# Differential expression
deg:
  test: "MAST"
  min_pct: 0.1
  logfc_threshold: 0.25
  padj_threshold: 0.05

# Trajectory analysis
trajectory:
  scvelo_mode: "dynamical"
  n_top_genes: 2000

# Cell communication
cellchat:
  database: "CellChatDB.mouse"
  min_cells: 10

cellphonedb:
  iterations: 1000
  threshold: 0.1

# SCENIC
scenic:
  species: "mm"
  n_workers: 16
  min_genes: 20

# Integration
integration:
  method: "harmony"
  reference_dataset: "Gurtner"  # GSE182001

# =============================================================================
# Cluster Colors
# =============================================================================
colors:
  eosinophil_clusters:
    C0: "#6CA6CD"
    C1: "#E84A5F"
    C2: "#FF6F1F"
    C3: "#CBAACB"
    C4: "#B03A48"
    C5: "#5BA4A4"
    C6: "#2F3C7E"

  macrophage_subtypes:
    M1: "#E41A1C"
    M2_Surface: "#377EB8"
    M2_Functional: "#4DAF4A"

  conditions:
    WT_Male: "#1F77B4"
    WT_Female: "#FF7F0E"
    KO_Male: "#2CA02C"
    KO_Female: "#D62728"

# =============================================================================
# Resources
# =============================================================================
resources:
  threads: 8
  memory_gb: 64
